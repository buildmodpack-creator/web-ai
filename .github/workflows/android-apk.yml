name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Tao project Capacitor
        run: |
          mkdir -p "$RUNNER_TEMP/apk/www" && cd "$RUNNER_TEMP/apk"
          cat > package.json <<'JSON'
          {"name":"freellmapi-android","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.freellmapi.app","appName":"FreeLLMAPI","webDir":"www",
           "server":{"cleartext":true,"allowNavigation":["*"]}}
          JSON
          cat > www/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>FreeLLMAPI</title>
          <style>body{font-family:system-ui;background:#0f1115;color:#eee;margin:0;padding:24px;display:flex;min-height:100vh;align-items:center;justify-content:center}
          .b{width:100%;max-width:420px}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:10px;border:1px solid #333;font-size:16px}
          input{background:#1a1d24;color:#eee}button{background:#4f7cff;color:#fff;border:0}</style></head>
          <body><div class="b"><h2>FreeLLMAPI</h2><p>Nhap dia chi server</p>
          <input id="u" placeholder="http://192.168.1.10:3001" inputmode="url" autocapitalize="off">
          <button id="go">Ket noi</button></div>
          <script>
          var K='freellmapi_server',u=document.getElementById('u'),s=null;
          try{s=localStorage.getItem(K)}catch(e){}
          if(s&&location.hash!=='#change'){location.replace(s)}else if(s){u.value=s}
          document.getElementById('go').onclick=function(){var v=u.value.trim();if(!v)return;
          if(!/^https?:\/\//.test(v))v='http://'+v;try{localStorage.setItem(K,v)}catch(e){}location.replace(v)};
          </script></body></html>
          HTML
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd "$RUNNER_TEMP/apk/android"
          chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLLMAPI-apk
          path: ${{ runner.temp }}/apk/android/app/build/outputs/apk/debug/app-debug.apk
